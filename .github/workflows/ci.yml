name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ZauberRTE.sln

      - name: Build
        run: dotnet build ZauberRTE.sln -c Release --no-restore

      - name: Test
        run: dotnet test --solution ZauberRTE.sln -c Release --no-build

  publish-nuget:
    name: Publish NuGet
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nuget-release-master
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          existing_tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -n "${existing_tag}" ]]; then
            echo "tag_already_exists=true" >> "$GITHUB_OUTPUT"
            echo "tag=${existing_tag}" >> "$GITHUB_OUTPUT"
            echo "version=${existing_tag#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          csproj_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' ZauberCMS.RTE/ZauberCMS.RTE.csproj | head -n 1)"

          if ! git rev-parse -q --verify "refs/tags/v${csproj_version}" > /dev/null; then
            new_version="${csproj_version}"
          else
            latest="$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
            base_version="$(printf '%s\n%s\n' "${csproj_version}" "${latest#v}" | sort -V | tail -n 1)"
            IFS='.' read -r major minor patch <<< "${base_version}"
            new_version="${major}.${minor}.$((patch + 1))"
          fi

          echo "tag_already_exists=false" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${new_version} (csproj=${csproj_version})"

      - name: Stamp version into csproj
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s|<Version>[^<]*</Version>|<Version>${{ steps.version.outputs.version }}</Version>|" ZauberCMS.RTE/ZauberCMS.RTE.csproj
          grep -n '<Version>' ZauberCMS.RTE/ZauberCMS.RTE.csproj

      - name: Build and test
        run: |
          dotnet build ZauberRTE.sln -c Release
          dotnet test --solution ZauberRTE.sln -c Release --no-build

      - name: Pack
        run: dotnet pack ZauberCMS.RTE/ZauberCMS.RTE.csproj -c Release --no-build --output nupkgs

      - name: Push package to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          package="nupkgs/ZauberCMS.RTE.${{ steps.version.outputs.version }}.nupkg"
          test -f "${package}"
          dotnet nuget push "${package}" \
            --api-key "${NUGET_API_KEY}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Create and push release tag
        if: steps.version.outputs.tag_already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Commit stamped version back to master
        if: steps.version.outputs.tag_already_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZauberCMS.RTE/ZauberCMS.RTE.csproj
          if git diff --cached --quiet; then
            echo "csproj already at ${{ steps.version.outputs.version }}"
            exit 0
          fi
          git commit -m "Bump ZauberCMS.RTE version to ${{ steps.version.outputs.version }} [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
